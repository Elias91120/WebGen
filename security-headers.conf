# Security headers of 3geeks.fr, included by nginx.conf in the server and in every location that sets
# its own add_header (nginx drops the server-level add_header in such a location).
# HSTS without includeSubDomains: the other *.3geeks.fr apps manage their own.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# No script-src yet: a full policy needs a pass in a real browser first (Calendly, fonts, videos, the game page).
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
