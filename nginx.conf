# Assistant API rate limit, keyed on the visitor's IP as forwarded by Cloudflare.
map $http_cf_connecting_ip $visitor_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $visitor_ip zone=assistant:1m rate=12r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text here, not in the proxy: proxy-level gzip also compressed the videos,
    # which removed byte-range support and stopped them playing on iOS Safari.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # Hashed build files never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Videos are served as-is (no compression) so range requests work.
    location /videos/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Assistant API (server/index.mjs). Unbuffered so answers stream as they are written.
    location /api/chat {
        limit_req zone=assistant burst=6 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        gzip off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Client-IP $visitor_ip;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # AI services page (its own HTML entry, built to dist/ia/index.html). Served on /ia and /ia/
    # without a redirect, so shared links keep their own title and preview.
    location ~ ^/ia/?$ {
        add_header Cache-Control "no-cache";
        try_files /ia/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
